name: Refresh featured projects

on:
  schedule:
    - cron: "12 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-projects
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Refresh project section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_projects.py

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md; then
            echo "No profile changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh featured projects"
          git push
