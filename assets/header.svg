<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Eric Jay</title>
  <desc id="desc">Technology Operations, Automation and Computer Science</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="330" rx="24" fill="url(#fade)"/>
  <rect width="1200" height="330" rx="24" fill="url(#grid)" opacity=".55"/>

  <circle cx="1008" cy="76" r="4" fill="#14b8a6"/>
  <circle cx="1032" cy="76" r="4" fill="#475569"/>
  <circle cx="1056" cy="76" r="4" fill="#475569"/>

  <path d="M86 86h92" stroke="#14b8a6" stroke-width="4" stroke-linecap="round"/>
  <text x="86" y="158" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="700" letter-spacing="-2">ERIC JAY</text>
  <text x="89" y="207" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" letter-spacing="1.5">TECHNOLOGY OPERATIONS  ·  AUTOMATION  ·  COMPUTER SCIENCE</text>

  <g transform="translate(89 250)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17">
    <text x="0" y="0" fill="#14b8a6">$</text>
    <text x="24" y="0" fill="#cbd5e1">build reliable systems</text>
    <rect x="252" y="-16" width="10" height="20" fill="#14b8a6" opacity=".9">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(936 188)">
    <rect x="0" y="0" width="150" height="58" rx="12" fill="#111827" stroke="#334155"/>
    <circle cx="30" cy="29" r="8" fill="#14b8a6"/>
    <path d="M52 22h70M52 35h48" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
